name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
      - "clusters/**"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the app
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/hello:${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          spin build
          echo "${{ secrets.GITHUB_TOKEN }}" | spin registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          spin registry push "$IMAGE"
      - name: Bump the image tag
        run: |
          yq -i ".spec.image = \"$IMAGE\"" deploy/hello/spinapp.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "hello: ${GITHUB_SHA::7}"
          git push